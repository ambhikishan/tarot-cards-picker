
<div class="spread-container">
<div *ngFor="let card of shuffledCards" class="card-wrapper" (click)="revealCard(card)">

    <div *ngIf="!card.revealed" class="card-back"></div>
    
    <div *ngIf="card.revealed">
    <img [src]="'/images/tarot-cards/' + card.name + '.jpg'" [alt]="card" class="tarot-image">
    <p>{{cards[card.name]}}</p>
    </div>
  </div>
</div>
<h1>{{drawnCards.toString()}}</h1>
<button class="control" (click)="clearNShuffle()">clear & Shuffle</button>
